<!DOCTYPE html>
<html>
<head>
    <title>My First GitHub Website</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            background-color: #000000; /* Pure black background */
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Define the color classes */
        .red-text {
            color: #e74c3c;
        }
        
        .blue-text {
            color: #3498db;
        }
        
        .white-text {
            color: #ffffff;
        }

        /* Make the main heading much bigger and centered */
        h1 {
            font-size: 5.5rem;
            margin: 0 0 20px 0;
            text-align: center;
            line-height: 1.2;
        }

        /* Style and size for the subtitle text */
        .subtitle {
            color: #ffffff;
            font-size: 1.5rem;
            margin: 0;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <h1>
        <span class="red-text">D</span><span class="blue-text">e</span> 
        <span class="white-text">P</span><span class="red-text">u</span><span class="blue-text">e</span><span class="white-text">r</span><span class="red-text">t</span><span class="blue-text">o</span> 
        <span class="white-text">R</span><span class="red-text">i</span><span class="blue-text">c</span><span class="white-text">o</span> 
        <span class="red-text">p</span><span class="blue-text">a</span><span class="white-text">'</span><span class="red-text">l</span> 
        <span class="blue-text">m</span><span class="white-text">u</span><span class="red-text">n</span><span class="blue-text">d</span><span class="white-text">o</span> 
        <span class="red-text">C</span><span class="blue-text">B</span>
    </h1>
    
    <p class="subtitle">"A serious military webiste"</p>
</body>
</html>
