<!DOCTYPE html>
<html>
<head>
    <title>My First GitHub Website</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        body {
            background-color: #000000;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 0.5s ease;
        }

        /* Color classes */
        .red-text { color: #e74c3c; }
        .blue-text { color: #3498db; }
        .white-text { color: #ffffff; }

        /* Main heading styling & interactive hover effect */
        h1 {
            font-size: 3.5rem;
            margin: 0 0 20px 0;
            text-align: center;
            line-height: 1.2;
            cursor: pointer;
        }

        /* Make individual letters pop and bounce when hovered */
        h1 span {
            display: inline-block;
            transition: transform 0.2s ease, text-shadow 0.2s ease;
        }

        h1 span:hover {
            transform: scale(1.3) translateY(-10px);
            text-shadow: 0 0 15px currentColor;
        }

        /* Subtitle */
        .subtitle {
            color: #ffffff;
            font-size: 1.5rem;
            margin: 0 0 30px 0;
            letter-spacing: 2px;
        }

        /* Interactive Button */
        .interactive-btn {
            background-color: transparent;
            color: #3498db;
            border: 2px solid #3498db;
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .interactive-btn:hover {
            background-color: #3498db;
            color: #000000;
            box-shadow: 0 0 20px #3498db;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1 title="Hover over the letters!">
        <span class="red-text">D</span><span class="blue-text">e</span> 
        <span class="white-text">P</span><span class="red-text">u</span><span class="blue-text">e</span><span class="white-text">r</span><span class="red-text">t</span><span class="blue-text">o</span> 
        <span class="white-text">R</span><span class="red-text">i</span><span class="blue-text">c</span><span class="white-text">o</span> 
        <span class="red-text">p</span><span class="blue-text">a</span><span class="white-text">'</span><span class="red-text">l</span> 
        <span class="blue-text">m</span><span class="white-text">u</span><span class="red-text">n</span><span class="blue-text">d</span><span class="white-text">o</span> 
        <span class="red-text">C</span><span class="blue-text">B</span>
    </h1>
    
    <p class="subtitle" id="subtitle-text">Hello World!</p>

    <!-- Interactive Button that triggers JavaScript -->
    <button class="interactive-btn" onclick="changeVibe()">Click to Change Vibe</button>

    <script>
        // Array of fun messages for the subtitle when the button is clicked
        const messages = [
            "Hello World!",
            "¡Wepa! 🔥",
            "Built with Code & Pride 🇵🇷",
            "Live on GitHub Pages 🚀"
        ];
        let msgIndex = 0;

        function changeVibe() {
            // Cycle through messages
            msgIndex = (msgIndex + 1) % messages.length;
            document.getElementById("subtitle-text").innerText = messages[msgIndex];

            // Randomize background flash color slightly
            const colors = ["#000000", "#110b1e", "#0b192c", "#1f0f0f"];
            document.body.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        }
    </script>
</body>
</html>
